# Local stack: the app (API + built frontend) on http://localhost:${WEB_PORT:-8080}, with a database.
# Copy .env.example to .env to configure sign-in; without it the app starts with defaults.
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://horizon:${POSTGRES_PASSWORD:-horizon}@db:5432/horizon
    ports:
      - "${WEB_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-horizon}
      POSTGRES_DB: horizon
    # Reachable from this machine only, for an API started outside Docker (see "Local development").
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during its first start the image briefly runs a server that answers on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U horizon -d horizon"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
