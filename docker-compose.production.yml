# Production compose: pulls the prebuilt image tagged by the deploy workflow
# instead of building from source.
#
# TLS and the public domain are handled by the shared nginx-proxy on the
# external `pmi_network`. `web` joins it and advertises itself through
# VIRTUAL_HOST/VIRTUAL_PORT.
# Per-host proxy settings live in deploy/vhost.d/ (copied to the proxy by hand).
services:
  web:
    image: horizon-web:latest
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST:-horizon.pmi.moscow}
      VIRTUAL_PORT: "80"
    # loopback only, for debugging on the host; public traffic comes via nginx-proxy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8087}:80"
    networks:
      - default
      - pmi_network
    restart: unless-stopped

networks:
  pmi_network:
    external: true
