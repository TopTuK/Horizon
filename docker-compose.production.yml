# Production compose: runs the prebuilt image tagged by the deploy workflow instead of building.
#
# TLS and the public domain are handled by the shared nginx-proxy on the external `pmi_network`.
# `app` joins it and advertises itself through VIRTUAL_HOST/VIRTUAL_PORT; `db` stays on the internal
# network only. Credentials come from .env on the server (see deployment.md).
services:
  app:
    image: horizon:latest
    env_file: .env
    environment:
      # Composed here, so the password is stored once for the database as well.
      DATABASE_URL: postgresql+asyncpg://horizon:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from .env}@db:5432/horizon
      # Fixed by the deployment, whatever .env says.
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
      VIRTUAL_HOST: ${VIRTUAL_HOST:-horizon.pmi.moscow}
      VIRTUAL_PORT: "8000"
    # loopback only, for debugging on the host; public traffic comes via nginx-proxy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8087}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - pmi_network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from .env}
      POSTGRES_DB: horizon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during its first start the image briefly runs a server that answers on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U horizon -d horizon"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - default
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  pmi_network:
    external: true
